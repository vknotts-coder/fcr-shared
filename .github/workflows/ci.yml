name: CI

# Build + test the shared package on every PR and on push to main. Since fcr-* apps
# consume @fcr/core as a prebuilt tarball, this is where its RBAC engine + contracts
# get their coverage — a green tag here is the guarantee the fleet depends on.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Clean FIRST so the guard below catches a deleted-source orphan (tsc emits, never prunes) as well
      # as edits — the committed dist must be exactly what a from-scratch build of this src produces.
      - name: Typecheck + emit dist (from clean)
        run: npm run clean && npm run build
      # Consumers run the COMMITTED dist/* (package.json "exports"/"files"), while the tests import src/*
      # — so a stale, hand-edited, missing, or orphaned dist ships behavior the suite never exercised.
      # `git status --porcelain` (not `git diff`) is required: it also reports UNTRACKED files, so a new
      # module whose dist was never committed, and a deleted module's orphaned dist, both fail here.
      - name: dist is in sync with src (no stale/missing/orphaned committed dist)
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::committed dist/ is out of sync — run 'npm run clean && npm run build' and commit dist/"
            git status --porcelain -- dist
            exit 1
          fi
      - name: Unit tests (can() + loadPrincipalGrants)
        run: npm test
