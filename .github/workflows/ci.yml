name: CI

# Build + test the shared package on every PR and on push to main. Since fcr-* apps
# consume @fcr/core as a prebuilt tarball, this is where its RBAC engine + contracts
# get their coverage — a green tag here is the guarantee the fleet depends on.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck + emit dist
        run: npm run build
      # Consumers run the COMMITTED dist/* (package.json "exports"/"files"), while the tests import src/*
      # — so a stale or hand-edited dist ships behavior the suite never exercised. `npm run build` above
      # just re-emitted dist from this exact src; fail if that output differs from what's committed.
      - name: dist is in sync with src (no stale committed dist)
        run: |
          git diff --exit-code -- dist \
            || { echo "::error::committed dist/ is stale — run 'npm run build' and commit dist/"; exit 1; }
      - name: Unit tests (can() + loadPrincipalGrants)
        run: npm test
